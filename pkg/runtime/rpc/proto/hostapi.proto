syntax = "proto3";

// Package glyphux.rpc.v1 is the Tier-C (PRD §8.1) wire contract between the
// host process (glyphuxd) and an out-of-process RPC plugin subprocess. Two
// services, one per direction of the "go-plugin model" (PRD §8.1, §10.3):
//
//   - HostAPI is served BY THE HOST, called BY THE PLUGIN. It is the gRPC
//     transport for pkg/sdk.HostAPI (PRD §8.3's unified extension contract) —
//     only the methods this slice wires up (Store, Emit, AllowsNetworkHost)
//     are exposed; every RPC here delegates to a real sdk.HostAPI value,
//     which is where PRD §10.3's boundary enforcement ("stripped of anything
//     it did not declare") actually lives — this proto layer adds no gating
//     of its own, it just carries sdk.HostAPI's existing capability-gated
//     errors across the process boundary as gRPC status errors.
//   - Plugin is served BY THE PLUGIN SUBPROCESS, called BY THE HOST. Register
//     is the plugin's entry point (mirrors the conceptual
//     Plugin.Register(host HostAPI) shape from PRD §8.3) — the host calls it
//     once the plugin's gRPC server is confirmed listening, and the plugin
//     subprocess is expected to call back into HostAPI during its handling
//     of Register, exactly as a real Tier-C plugin would during startup.
package glyphux.rpc.v1;

option go_package = "github.com/glyphux/glyphux/pkg/runtime/rpc/rpcpb";

// HostAPI is the host-side service a plugin subprocess dials to reach its
// capability-gated pkg/sdk.HostAPI. Store* methods correspond to
// sdk.HostAPI.Store() (always present — no capability gates persistence,
// see pkg/sdk/host.go). Emit corresponds to sdk.HostAPI.Emit, gated on the
// "events:emit" api scope by the underlying sdk.HostAPI — a plugin whose
// manifest didn't declare it gets a gRPC error, not a silent no-op.
// AllowsNetworkHost corresponds to sdk.HostAPI.AllowsNetworkHost, the
// network-allowlist decision primitive (PRD §10.4, "allowlisted network").
service HostAPI {
  rpc StoreGet(StoreGetRequest) returns (StoreGetResponse);
  rpc StoreSet(StoreSetRequest) returns (StoreSetResponse);
  rpc StoreDelete(StoreDeleteRequest) returns (StoreDeleteResponse);
  rpc Emit(EmitRequest) returns (EmitResponse);
  rpc AllowsNetworkHost(AllowsNetworkHostRequest) returns (AllowsNetworkHostResponse);
}

message StoreGetRequest {
  string key = 1;
}

message StoreGetResponse {
  bytes value = 1;
  bool ok = 2;
}

message StoreSetRequest {
  string key = 1;
  bytes value = 2;
}

message StoreSetResponse {}

message StoreDeleteRequest {
  string key = 1;
}

message StoreDeleteResponse {}

message EmitRequest {
  string event = 1;
  bytes payload = 2;
}

message EmitResponse {}

message AllowsNetworkHostRequest {
  string host = 1;
}

message AllowsNetworkHostResponse {
  bool allowed = 1;
}

// Plugin is the plugin-subprocess-side service the host dials once the
// subprocess signals it is listening. Register is the subprocess's single
// entry point for this slice's test fixture: the host calls it with a mode
// string selecting fixture behavior (see pkg/runtime/rpc/testdata/fixtureplugin),
// and the fixture's handler is expected to call back into HostAPI (above)
// during its handling of Register — proving a real, bidirectional,
// cross-process gRPC round trip, not a one-way call.
service Plugin {
  rpc Register(RegisterRequest) returns (RegisterResponse);
}

message RegisterRequest {
  string mode = 1;
  // arg carries mode-specific data — e.g. for "network-check", the host
  // name to query AllowsNetworkHost with.
  string arg = 2;
}

message RegisterResponse {
  repeated string log = 1;
  bool ok = 2;
  string error = 3;
}
