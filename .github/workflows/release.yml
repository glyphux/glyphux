name: Release

# Triggered by pushing a version tag (vX.Y.Z), matching ci.yml's own
# GOOS/GOARCH matrix so a release build never covers a different platform
# set than CI already verified. Builds admin-ui fresh and cross-compiles
# glyphuxd/glyphux per platform (modernc.org/sqlite is pure Go, so
# CGO_ENABLED=0 cross-compilation from one Linux runner is safe for every
# target, including darwin/windows), then packages the release artifact
# contract (Ticket T10c) with cmd/glyphux-release: deterministic
# per-platform zips (binaries + a VERSION file single-sourced from the
# repo-root VERSION) plus a SHA256SUMS listing, published to a GitHub
# Release. (The legacy shell builder scripts/release/build.sh remains for
# local use; this workflow is the canonical release path.)
on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin-ui/package-lock.json
      - name: Rebuild sdk-js (admin-ui depends on it via file:../sdk-js)
        run: |
          cd sdk-js
          npm ci
          npm run build
      - name: Rebuild admin-ui (embedded into glyphuxd via go:embed)
        run: |
          cd admin-ui
          npm ci
          npm run build
      - name: Derive bare semver from the tag (strip the leading v)
        # Tag pushes are v0.2.0, but release binaries must report BARE
        # MAJOR.MINOR.PATCH — the pkg/kernel.Version invariant and
        # scripts/release/build.sh's fail-closed guard both require bare
        # semver, and cmd/glyphux-release names the packaged zips from the
        # bare repo-root VERSION file. One clean VERSION for every later
        # step and the ldflags (never inject github.ref_name verbatim).
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Cross-compile glyphuxd + glyphux
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p dist
          ldflags="-s -w -X main.version=${VERSION} -X github.com/glyphux/glyphux/pkg/kernel.Version=${VERSION}"
          go build -trimpath -ldflags "$ldflags" -o "dist/glyphuxd-$GOOS-$GOARCH$ext" ./cmd/glyphuxd
          go build -trimpath -ldflags "$ldflags" -o "dist/glyphux-$GOOS-$GOARCH$ext" ./cmd/glyphux
      - uses: actions/upload-artifact@v4
        with:
          name: glyphux-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        # gh release create --generate-notes shells out to git to build the
        # commit-range notes; without a checkout here this job has no
        # .git directory at all and fails with "fatal: not a git
        # repository" (caught by actually running this workflow against a
        # real tag push, not just reading the YAML).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: glyphux-*
          merge-multiple: true
      - name: "Package release artifacts (T10c: deterministic zips + VERSION + SHA256SUMS)"
        run: go run ./cmd/glyphux-release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip dist/SHA256SUMS \
            --title "${{ github.ref_name }}" \
            --generate-notes
