name: Release

# Triggered by pushing a version tag (vX.Y.Z), matching ci.yml's own
# GOOS/GOARCH matrix so a release build never covers a different platform
# set than CI already verified. Builds admin-ui fresh and cross-compiles
# glyphuxd/glyphux per platform (modernc.org/sqlite is pure Go, so
# CGO_ENABLED=0 cross-compilation from one Linux runner is safe for every
# target, including darwin/windows), packages archives + SHA256SUMS, and
# publishes them to a GitHub Release.
on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin-ui/package-lock.json
      - name: Rebuild sdk-js (admin-ui depends on it via file:../sdk-js)
        run: |
          cd sdk-js
          npm ci
          npm run build
      - name: Rebuild admin-ui (embedded into glyphuxd via go:embed)
        run: |
          cd admin-ui
          npm ci
          npm run build
      - name: Build + package glyphuxd + glyphux
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          work="glyphux-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p "dist/$work"
          ldflags="-s -w -X main.version=${VERSION}"
          go build -trimpath -ldflags "$ldflags" -o "dist/$work/glyphuxd$ext" ./cmd/glyphuxd
          go build -trimpath -ldflags "$ldflags" -o "dist/$work/glyphux$ext" ./cmd/glyphux
          cp README.md "dist/$work/"
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -qr "${work}.zip" "$work")
          else
            tar -C dist -czf "dist/${work}.tar.gz" "$work"
          fi
          rm -rf "dist/$work"
      - uses: actions/upload-artifact@v4
        with:
          name: glyphux-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: glyphux-*
          merge-multiple: true
      - name: Checksums
        run: (cd dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "${{ github.ref_name }}" \
            --generate-notes
