name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build glyphuxd + glyphux
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p dist
          go build -trimpath -o "dist/glyphuxd-$GOOS-$GOARCH$ext" ./cmd/glyphuxd
          go build -trimpath -o "dist/glyphux-$GOOS-$GOARCH$ext" ./cmd/glyphux
      - uses: actions/upload-artifact@v4
        with:
          name: glyphux-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # Admin SPA freshness (Ticket T9 / gap 9 (c)): internal/adminui/dist is
  # committed (so `go build` works without Node), but it must not drift from
  # what admin-ui/ actually builds. This job rebuilds it from source with
  # the same commands as the justfile admin-ui-rebuild target and fails if
  # the committed tree differs in any way (modified, added, or removed
  # files). Node is pinned to the same version release.yml uses so rebuilds
  # are byte-identical; if a rebuild produces a different tree, commit the
  # freshly-built dist (via `just admin-ui-rebuild`) rather than relaxing
  # this check.
  admin-ui-dist-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild sdk-js + admin-ui from source
        run: |
          npm --prefix sdk-js ci
          npm --prefix sdk-js run build
          npm --prefix admin-ui ci
          npm --prefix admin-ui run build
      - name: Fail if committed dist is stale
        run: |
          if ! git diff --quiet -- internal/adminui/dist || [ -n "$(git status --porcelain -- internal/adminui/dist)" ]; then
            echo "internal/adminui/dist is stale: run \`just admin-ui-rebuild\` and commit the result"
            git status --porcelain -- internal/adminui/dist
            exit 1
          fi
